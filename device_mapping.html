<div class="container">

    <nav class="pagenav">

<script>
  // สิทธิ์ที่รองรับ + ลำดับแสดงผล
  const RIGHT_KEYS = ['UCS', 'OFC', 'LGO', 'NHS', 'PVT'];

  // ที่มา: GSheet "ระบบรายการอุปกรณ์เบิกได้ตามสิทธิ 2569"
  const RIGHTS = {
    '7301': { name: 'สกรูยึดแผ่นโลหะชนิดหัวล็อก (Lock screw)', short: 'Lock screw', unit: 'ตัว',
      prices: { UCS: 1600, OFC: 2400, LGO: 2400, NHS: 2400, PVT: 2400 } },
    '7302': { name: 'สกรูยึดแผ่นโลหะดามกระดูก (Cortex screw)', short: 'Cortex screw', unit: 'ตัว',
      prices: { UCS: 270, OFC: 300, LGO: 300, NHS: 300, PVT: 300 } },
    '7313': { name: 'K-wire', short: 'K-wire', unit: 'เส้น',
      prices: { UCS: 200, OFC: 300, LGO: 300, NHS: 300, PVT: 300 } },
    '7315': { name: 'สกรูยึดกระดูกชนิดมีรูสอดแกนนำทาง (Cannulated screw)', short: 'Cannulated screw', unit: 'ตัว',
      prices: { UCS: 2000, OFC: 3000, LGO: 3000, NHS: 3000, PVT: 3000 } },
    '7312': { name: 'ลวด (Cerclage wire)', short: 'Cerclage wire', unit: 'เส้น',
      prices: { UCS: null, OFC: 1500, LGO: 1500, NHS: 1500, PVT: 1500 } },
    '7210': { name: 'แผ่นโลหะดามกระดูก ชนิดแคบ (Narrow plate)', short: 'Narrow plate', unit: 'ชิ้น',
      prices: { UCS: 2200, OFC: 5000, LGO: 5000, NHS: 5000, PVT: 5000 } },
    '7212': { name: 'แผ่นโลหะดามกระดูก ชนิดเล็ก (Small fragment plate)', short: 'Small fragment plate', unit: 'ชิ้น',
      prices: { UCS: 1300, OFC: 1500, LGO: 1500, NHS: 1500, PVT: 1500 } },
    '7214': {
      name: 'แผ่นโลหะดามกระดูก ชนิดหัวล็อก (Locking compression plate)', short: 'Locking plate', unit: 'ชิ้น',
      variants: {
        A: { label: 'A — Locking compression plate', prices: { UCS: 10000, OFC: 10000, LGO: 10000, NHS: 10000, PVT: 10000 } },
        B: { label: 'B — ชนิดหัวล็อกสำหรับใส่ข้อ (Distal radius)', prices: { UCS: 17000, OFC: 17000, LGO: 17000, NHS: 17000, PVT: 17000 } }
      }
    },
    '7207': {
      name: 'แผ่นดามกระดูกสันหลัง ส่วนคอ (Cervical locking plate)', short: 'Cervical plate', unit: 'ระดับ',
      variants: {
        A: { label: 'A — 24,000 บาท/ระดับ', prices: { UCS: 24000, OFC: 24000, LGO: 24000, NHS: 24000, PVT: 24000 } },
        B: { label: 'B — 12,000 บาท/ระดับ', prices: { UCS: 12000, OFC: 12000, LGO: 12000, NHS: 12000, PVT: 12000 } }
      }
    }
  };

  const VENDORS = ['Emerson', 'รพ.', 'Rockwood', 'MDC'];

  // --- หมวดอุปกรณ์: ลำดับตามที่ Kit เน้น Screws และ K-wire ไว้บนๆ ---
  const CATEGORY_ORDER = ['screw-cortex', 'screw-locking', 'screw-cancellous', 'cannulated', 'kwire', 'plate', 'wire'];
  const CATEGORIES = {
    'screw-cortex':     { label: 'Cortex screws',     icon: '🔩', color: '#dbeafe' },
    'screw-locking':    { label: 'Locking screws',    icon: '🔩', color: '#e0e7ff' },
    'screw-cancellous': { label: 'Cancellous screws', icon: '🔩', color: '#fce7f3' },
    'cannulated':       { label: 'Cannulated screws',      icon: '🔩', color: '#fef3c7' },
    'kwire':            { label: 'K-wire',          icon: '📌', color: '#dcfce7' },
    'plate':            { label: 'เพลท',            icon: '🛡️', color: '#fee2e2' },
    'wire':             { label: 'ลวด',             icon: '🧵', color: '#ede9fe' }
  };

  let idCounter = 11;
  // K-wire ทุกขนาด (ตาม pricelist Sigma+AOSYS): dia 0.8–2.5 = 60฿(150mm)/85฿(300mm), dia 3.0 = 120/220; รหัสสิทธิ์ 7313
  const kwireDias = [0.8, 1.0, 1.2, 1.4, 1.6, 1.8, 2.0, 2.5, 3.0];
  const kwireLens = [150, 300];
  let kid = 100;
  const kwireRows = [];
  kwireLens.forEach(len => kwireDias.forEach(dia => {
    kwireRows.push({ id: kid++, category: 'kwire', family: 'K-wire', itemName: `K-wire ${dia}×${len}mm`, vendor: 'รพ.', code: '7313', variant: '', note: '', locked: true });
  }));
  const devices = [
    { id: 1, category: 'screw-locking', family: 'Locking screws 3.5', itemName: 'Self Tapping Locking screw 3.5×30mm', vendor: 'Emerson', code: '7301', variant: '', note: '', locked: true },
    { id: 2, category: 'screw-locking', family: 'Locking screws 3.5', itemName: 'Self Tapping Locking screw 3.5×50mm', vendor: 'Emerson', code: '7301', variant: '', note: '', locked: true },
    { id: 3, category: 'screw-cortex', family: 'Cortex screws', itemName: 'Cortex screw 3.5×24mm', vendor: 'รพ.', code: '7302', variant: '', note: '', locked: true },
    { id: 31, category: 'screw-cortex', family: 'Cortex screws', itemName: 'Cortex screw 3.5×24mm', vendor: 'Emerson', code: '7302', variant: '', note: 'ซ้ำ ถือ 2 บริษัท (รหัสตรง)', locked: true },
    { id: 32, category: 'screw-cortex', family: 'Cortex screws', itemName: 'Cortex screw 3.5×30mm', vendor: 'Emerson', code: '7303', variant: '', note: 'ตัวอย่างรหัสขัดแย้ง (ควรเป็น 7302)', locked: true },
    { id: 33, category: 'screw-cortex', family: 'Cortex screws', itemName: 'Cortex screw 3.5×30mm', vendor: 'รพ.', code: '7302', variant: '', note: 'คู่กับ Emerson (รหัสต่าง → ต้องเตือน)', locked: true },
    { id: 4, category: 'screw-cortex', family: 'Cortex screws', itemName: 'Cortex screw 4.5×40mm', vendor: 'รพ.', code: '7302', variant: '', note: '', locked: true },
    ...kwireRows,
    { id: 7, category: 'cannulated', family: 'Cannulated screws', itemName: 'Cannulated Locking screw 6.5×60mm', vendor: 'Emerson', code: '7315', variant: '', note: '', locked: true },
    { id: 8, category: 'wire', family: 'Cerclage wire', itemName: 'Cerclage wire 18 gauge', vendor: 'Emerson', code: '7312', variant: '', note: '', locked: true },
    { id: 9, category: 'plate', family: 'เพลท DCP', itemName: 'Small DCP Plate 4H L', vendor: 'รพ.', code: '7214', variant: 'A', note: '', locked: true },
    { id: 10, category: 'plate', family: 'เพลทหัวล็อก Distal Radius', itemName: 'Distal Radius Locking Plate 2H L (VA)', vendor: 'Rockwood', code: '7214', variant: 'B', note: '', locked: true }
  ];

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function money(n) {
    return n == null ? null : n.toLocaleString('th-TH');
  }

  function getRightsInfo(code, variant) {
    const r = RIGHTS[code];
    if (!r) return null;
    if (r.variants) {
      const v = r.variants[variant];
      if (!v) return null;
      return { name: r.name + ' — รุ่น ' + v.label, unit: r.unit, prices: v.prices };
    }
    return { name: r.name, unit: r.unit, prices: r.prices };
  }

  function isMatched(d) {
    const r = RIGHTS[d.code];
    if (!d.code || !r) return false;
    if (r.variants) return !!d.variant;
    return true;
  }

  // --- clinicalKey: กลุ่มอุปกรณ์ "ตัวเดียวกันทางคลินิก" ไม่ว่าจะมาจากบริษัทไหน ---
  // ดึงจาก (หมวด + ขนาด) ด้วย regex เดียวกันเสมอ เช่น "Cortex screw 3.5×24mm" → "cortex-3.5x24"
  // ถ้าดึงขนาดแบบ กว้างxยาว ไม่ได้ (ไม่มีรูปแบบตัวเลข x ตัวเลข) → fallback ไปที่ family/category แทน
  function deriveClinicalKey(d) {
    const catPart = (d.category || 'unk').toLowerCase().replace(/^screw-/, '');
    const text = `${d.itemName || ''} ${d.family || ''}`;
    const sizeMatch = text.match(/(\d+(?:\.\d+)?)\s*[x×X]\s*(\d+(?:\.\d+)?)/);
    if (sizeMatch) {
      return `${catPart}-${sizeMatch[1]}x${sizeMatch[2]}`;
    }
    const fam = (d.family || '').trim();
    if (fam) {
      return `${catPart}-${fam.toLowerCase().replace(/\s+/g, '-')}`;
    }
    return catPart;
  }

  // จัดกลุ่มรายการในหมวดเดียวกันตาม clinicalKey ให้แถวที่เป็นของเดียวกัน (คนละบริษัท) อยู่ติดกัน
  // คงลำดับการปรากฏครั้งแรกของแต่ละกลุ่มไว้ (ไม่กระจายตาม id)
  function buildGroupedRows(items) {
    const order = [];
    const groups = {};
    items.forEach(d => {
      const key = deriveClinicalKey(d);
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(d);
    });
    const result = [];
    order.forEach(key => {
      const list = groups[key];
      const vendorsSet = new Set(list.map(d => d.vendor || '—'));
      const multiVendor = vendorsSet.size > 1;
      list.forEach((d, idx) => {
        result.push({ device: d, groupIndex: idx, groupSize: list.length, multiVendor, clinicalKey: key });
      });
    });
    return result;
  }

  // ตรวจรหัสเบิกขัดแย้งข้ามบริษัท: clinicalKey เดียวกัน แต่ "รหัสหลัก" (code) ต่างกัน
  // ข้อยกเว้น: ถ้า code เดียวกันแต่ variant ต่างกัน (เช่น 7214A vs 7214B) ถือเป็นราคาต่างจริง ไม่เตือน
  function findClinicalKeyConflicts() {
    const groups = {};
    devices.forEach(d => {
      if (!d.code) return; // ยังไม่จับคู่ ข้ามไปก่อน
      const key = deriveClinicalKey(d);
      (groups[key] = groups[key] || []).push(d);
    });
    const conflicts = [];
    Object.keys(groups).forEach(key => {
      const list = groups[key];
      if (list.length < 2) return;
      const baseCodes = [...new Set(list.map(d => d.code))];
      if (baseCodes.length < 2) return; // code เดียวกัน (variant ต่างได้ ไม่ถือว่าขัดแย้ง)
      const label = list[0].itemName || list[0].family || key;
      const parts = list.map(d => `${d.vendor || '—'} = ${d.code}${d.variant || ''}`);
      conflicts.push({ key, label, parts });
    });
    return conflicts;
  }

  function renderConflictBanner(conflicts) {
    const banner = document.getElementById('conflictBanner');
    if (!conflicts.length) {
      banner.classList.remove('show');
      banner.innerHTML = '';
      return;
    }
    const items = conflicts.map(c =>
      `<li>⚠️ "${escapeHtml(c.label)}" มีรหัสเบิกไม่ตรงกัน: ${escapeHtml(c.parts.join(' / '))}</li>`
    ).join('');
    banner.innerHTML = `<div class="conflict-title">⚠️ พบรหัสเบิกไม่ตรงกันข้ามบริษัท (${conflicts.length} กลุ่ม) — ตรวจสอบก่อนยืนยันบันทึก</div><ul>${items}</ul>`;
    banner.classList.add('show');
  }

  function vendorOptions(selected) {
    return '<option value="">-- เลือก --</option>' +
      VENDORS.map(v => `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`).join('');
  }

  function codeOptions(selected) {
    return '<option value="">-- เลือกรหัส --</option>' +
      Object.keys(RIGHTS).map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c} · ${RIGHTS[c].short || RIGHTS[c].name.split(' (')[0]}</option>`).join('');
  }

  function variantOptions(code, selected) {
    const r = RIGHTS[code];
    if (!r || !r.variants) return '';
    return '<option value="">เลือก</option>' +
      Object.keys(r.variants).map(v => `<option value="${v}" ${v === selected ? 'selected' : ''}>${v}</option>`).join('');
  }

  // ชนิด/ครอบครัว (dropdown) → แมปหมวดอัตโนมัติ
  const FAMILY_OPTIONS = [
    { family: 'Cortex screws',            cat: 'screw-cortex' },
    { family: 'Cancellous screws',        cat: 'screw-cancellous' },
    { family: 'Locking screws 3.5',       cat: 'screw-locking' },
    { family: 'Locking screws 2.7',       cat: 'screw-locking' },
    { family: 'Locking screws 4.0',       cat: 'screw-locking' },
    { family: 'Cannulated screws',       cat: 'cannulated' },
    { family: 'K-wire',                 cat: 'kwire' },
    { family: 'Cerclage wire',          cat: 'wire' },
    { family: 'เพลท DCP',               cat: 'plate' },
    { family: 'เพลท LC-DCP',            cat: 'plate' },
    { family: 'เพลท Reconstruction',    cat: 'plate' },
    { family: 'เพลท Tubular',           cat: 'plate' },
    { family: 'เพลทหัวล็อกข้อใกล้ข้อ',   cat: 'plate' },
    { family: 'เพลท Mini plate',        cat: 'plate' },
    { family: 'เพลท Spinal',            cat: 'plate' },
  ];
  function familyOptions(selected) {
    return '<option value="">-- เลือกชนิด --</option>' +
      FAMILY_OPTIONS.map(f =>
        `<option value="${f.family}" ${f.family === selected ? 'selected' : ''}>${f.family}</option>`
      ).join('');
  }
  function familyToCategory(family) {
    const f = FAMILY_OPTIONS.find(x => x.family === family);
    return f ? f.cat : null;
  }

  function populateCategoryFilter() {
    const sel = document.getElementById('categoryFilter');
    const current = sel.value || 'all';
    sel.innerHTML = '<option value="all">ทั้งหมด</option>' +
      CATEGORY_ORDER.map(c => `<option value="${c}">${CATEGORIES[c].icon} ${CATEGORIES[c].label}</option>`).join('');
    sel.value = current;
    // vendor filter จาก VENDORS ลิสต์
    const vsel = document.getElementById('vendorFilter');
    const vcur = vsel.value || 'all';
    vsel.innerHTML = '<option value="all">ทั้งหมด</option>' +
      VENDORS.map(v => `<option value="${v}">${v}</option>`).join('');
    vsel.value = vcur;
  }

  function rightsGridHtml(prices) {
    return `<div class="rights-grid">${RIGHT_KEYS.map(k => {
      const val = prices[k];
      const valueTxt = val == null ? '&nbsp;' : money(val);
      return `<div class="rights-col"><div class="rights-col-label">${k}</div><div class="rights-col-value">${valueTxt}</div></div>`;
    }).join('')}</div>`;
  }

  // --- View mode: ข้อความล้วนสำหรับคอลัมน์ "รหัสเบิก" ---
  function codeViewHtml(d) {
    if (!d.code) {
      return '<div class="code-view-main muted">— ⏳</div>';
    }
    const r = RIGHTS[d.code];
    if (!r) {
      return `<div class="code-view-main">${escapeHtml(d.code)}</div>`;
    }
    const shortName = r.short || r.name.split(' (')[0];
    let html = `<div class="code-view-main" title="${escapeHtml(d.code + ' · ' + shortName)}">${escapeHtml(d.code)} · ${escapeHtml(shortName)}</div>`;
    if (r.variants) {
      const v = r.variants[d.variant];
      html += v
        ? `<div class="code-view-sub" title="${escapeHtml(v.label)}">${escapeHtml(v.label)}</div>`
        : '<div class="code-view-sub muted">ยังไม่เลือกรุ่น</div>';
    }
    return html;
  }

  function rowHtml(d, meta) {
    meta = meta || { groupIndex: 0, groupSize: 1, multiVendor: false, clinicalKey: deriveClinicalKey(d) };
    const isGroupChild = meta.groupIndex > 0;
    const showMultiVendorBadge = meta.groupIndex === 0 && meta.multiVendor;
    const indentPrefix = isGroupChild ? '<span class="group-indent-icon">↳</span>' : '';
    const badgeHtml = showMultiVendorBadge
      ? `<span class="multi-vendor-badge" title="กลุ่มคลินิก &quot;${escapeHtml(meta.clinicalKey)}&quot; มีรหัสจากหลายบริษัท">🏷️ ${meta.groupSize} แหล่ง</span>`
      : '';

    const rights = RIGHTS[d.code];
    const showVariant = rights && rights.variants;
    const info = getRightsInfo(d.code, d.variant);

    const rightsNameHtml = info
      ? `<div class="rights-head"><div class="rights-name" title="${escapeHtml(info.name)}">${escapeHtml(info.name)}</div><div class="rights-unit">บาท/${escapeHtml(info.unit)}</div></div>`
      : '<div class="badge-pending">⏳ ยังไม่จับคู่</div>';

    let priceHtml = '<span class="muted">-</span>';
    if (info) {
      priceHtml = rightsGridHtml(info.prices);
    }

    let deviceCellHtml, vendorCellHtml, codeCellHtml, noteCellHtml;

    if (d.locked) {
      // --- VIEW MODE: ข้อความล้วน ---
      deviceCellHtml =
        `<div class="item-name-view" title="${escapeHtml(d.itemName)}">${indentPrefix}${d.itemName ? escapeHtml(d.itemName) : '—'}</div>` +
        `<div class="family-view" title="${escapeHtml(d.family)}">${d.family ? escapeHtml(d.family) : '—'}</div>` +
        (badgeHtml ? `<div class="group-badge-row">${badgeHtml}</div>` : '');
      vendorCellHtml = `<div class="vendor-view" title="${escapeHtml(d.vendor)}">${d.vendor ? escapeHtml(d.vendor) : '—'}</div>`;
      codeCellHtml = codeViewHtml(d);
      noteCellHtml = `<div class="note-view ${d.note ? '' : 'muted'}" title="${escapeHtml(d.note)}">${d.note ? escapeHtml(d.note) : '—'}</div>`;
    } else {
      // --- EDIT MODE: dropdown/input เหมือนเดิม ---
      deviceCellHtml =
        `<input class="item-name-input" data-field="itemName" value="${escapeHtml(d.itemName)}">` +
        `<select class="family-select" data-field="family">${familyOptions(d.family)}</select>` +
        (badgeHtml ? `<div class="group-badge-row">${badgeHtml}</div>` : '');
      vendorCellHtml = `<select data-field="vendor">${vendorOptions(d.vendor)}</select>`;
      codeCellHtml =
        `<select data-field="code">${codeOptions(d.code)}</select>` +
        (showVariant ? `<select data-field="variant" style="margin-top:4px;">${variantOptions(d.code, d.variant)}</select>` : '');
      noteCellHtml = `<input data-field="note" value="${escapeHtml(d.note)}" placeholder="—">`;
    }

    return `<tr data-id="${d.id}" data-clinical-key="${escapeHtml(meta.clinicalKey)}" class="${isGroupChild ? 'group-child' : ''}">
      <td>${deviceCellHtml}</td>
      <td>${vendorCellHtml}</td>
      <td>${codeCellHtml}</td>
      <td>${rightsNameHtml}${priceHtml}</td>
      <td>${noteCellHtml}</td>
      <td style="white-space:nowrap;">
        <button class="secondary" data-action="toggle">${d.locked ? 'แก้ไข' : 'บันทึกแถว'}</button>
        <button class="danger" data-action="delete">ลบ</button>
      </td>
    </tr>`;
  }

  function sectionRowHtml(catKey, count) {
    const meta = CATEGORIES[catKey];
    return `<tr class="section-row" style="background:${meta.color};"><td colspan="6">${meta.icon} ${meta.label} (${count})</td></tr>`;
  }

  function renderTable() {
    const tbody = document.getElementById('tbody');
    const catFilter = document.getElementById('categoryFilter').value || 'all';
    const vendorFilter = document.getElementById('vendorFilter').value || 'all';

    let html = '';
    CATEGORY_ORDER.forEach(catKey => {
      const items = devices.filter(d =>
        d.category === catKey &&
        (catFilter === 'all' || d.category === catFilter) &&
        (vendorFilter === 'all' || d.vendor === vendorFilter)
      );
      if (items.length === 0) return;
      html += sectionRowHtml(catKey, items.length);
      // จัดกลุ่มแถวที่เป็นของเดียวกันทางคลินิก (clinicalKey เดียวกัน คนละบริษัท) ให้อยู่ติดกัน
      html += buildGroupedRows(items).map(g => rowHtml(g.device, g)).join('');
    });
    tbody.innerHTML = html;
    updateFooter();
  }

  function updateFooter() {
    const matched = devices.filter(isMatched).length;
    document.getElementById('matchedCount').textContent = matched;
    document.getElementById('totalCount').textContent = devices.length;
  }

  document.getElementById('tbody').addEventListener('change', e => {
    const tr = e.target.closest('tr');
    if (!tr) return;
    const id = Number(tr.dataset.id);
    const d = devices.find(x => x.id === id);
    if (!d) return;
    const field = e.target.dataset.field;
    if (!field) return;

    if (field === 'code') {
      d.code = e.target.value;
      d.variant = '';
    } else if (field === 'variant') {
      d.variant = e.target.value;
    } else if (field === 'family') {
      d.family = e.target.value;
      // เลือกชนิดแล้วตั้งหมวดให้อัตโนมัติ (ถ้ายังไม่ตรง)
      const autoCat = familyToCategory(d.family);
      if (autoCat) d.category = autoCat;
    } else {
      d[field] = e.target.value;
    }

    // กันแถวซ้ำ: แถวที่กำลังแก้ไข (ยังไม่ล็อก) ตั้งค่า itemName+vendor ตรงกับ clinicalKey+vendor ของแถวอื่นที่มีอยู่แล้ว
    if (!d.locked && ['itemName', 'family', 'vendor'].includes(field) && d.itemName && d.vendor) {
      const dupKey = deriveClinicalKey(d);
      const dup = devices.find(x => x.id !== d.id && x.vendor === d.vendor && deriveClinicalKey(x) === dupKey);
      if (dup) {
        const goEditExisting = confirm(
          `มี mapping นี้อยู่แล้ว (${dup.itemName || dup.family || dup.code} — ${dup.vendor}, รหัส ${dup.code || '—'})\nต้องการแก้ไขแถวเดิมแทนหรือไม่?`
        );
        if (goEditExisting) {
          const idx = devices.findIndex(x => x.id === d.id);
          devices.splice(idx, 1);
          dup.locked = false;
        }
      }
    }

    renderTable();
  });

  document.getElementById('tbody').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const tr = e.target.closest('tr');
    const id = Number(tr.dataset.id);
    const d = devices.find(x => x.id === id);
    if (!d) return;

    if (btn.dataset.action === 'toggle') {
      d.locked = !d.locked;
      renderTable();
    } else if (btn.dataset.action === 'delete') {
      if (confirm('ต้องการลบอุปกรณ์นี้ออกจากรายการหรือไม่?')) {
        const idx = devices.findIndex(x => x.id === id);
        devices.splice(idx, 1);
        renderTable();
      }
    }
  });

  document.getElementById('categoryFilter').addEventListener('change', renderTable);
  document.getElementById('vendorFilter').addEventListener('change', renderTable);

  document.getElementById('addBtn').addEventListener('click', () => {
    devices.push({
      id: idCounter++, category: 'screw-cortex', family: '', itemName: '', vendor: '', code: '', variant: '', note: '', locked: false
    });
    renderTable();
    const wrap = document.querySelector('.table-wrap');
    wrap.scrollTop = wrap.scrollHeight;
  });

  document.getElementById('saveBtn').addEventListener('click', () => {
    const conflicts = findClinicalKeyConflicts();
    renderConflictBanner(conflicts);

    const matched = devices.filter(isMatched).length;
    alert(`บันทึกข้อมูลเรียบร้อย\nอุปกรณ์ทั้งหมด: ${devices.length} รายการ\nจับคู่รหัสสิทธิ์แล้ว: ${matched} รายการ\nยังไม่จับคู่: ${devices.length - matched} รายการ`);
  });

  populateCategoryFilter();
  renderTable();
</script>

</body>
</html>
